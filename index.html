<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="TradePilot">

<title>TradePilot</title>

<style>

* {

  box-sizing: border-box;

  -webkit-tap-highlight-color: transparent;

}

body {

  margin: 0;

  background: #0b0f14;

  color: #fff;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

}

.app {

  max-width: 500px;

  margin: auto;

  min-height: 100vh;

  padding-bottom: 30px;

}

.header {

  padding: 22px 20px 16px;

  background: #111820;

  border-bottom: 1px solid #27313b;

}

.logo {

  font-size: 25px;

  font-weight: 800;

}

.demo {

  display: inline-block;

  margin-top: 7px;

  padding: 4px 9px;

  border-radius: 20px;

  background: #26313c;

  color: #9fb0bf;

  font-size: 11px;

  font-weight: 700;

}

.balance {

  margin: 18px 16px 10px;

  padding: 20px;

  background: #151d26;

  border: 1px solid #26313d;

  border-radius: 16px;

}

.label {

  color: #8997a5;

  font-size: 13px;

}

.big {

  margin-top: 5px;

  font-size: 31px;

  font-weight: 800;

}

.stats {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

  margin-top: 15px;

}

.stat {

  background: #10171f;

  border-radius: 12px;

  padding: 12px;

}

.value {

  margin-top: 4px;

  font-weight: 700;

}

.tabs {

  display: flex;

  gap: 8px;

  padding: 12px 16px;

}

.tab {

  flex: 1;

  padding: 13px;

  border: 1px solid #303b47;

  border-radius: 11px;

  background: #111820;

  color: #aeb9c4;

  font-weight: 700;

}

.tab.active {

  background: #263442;

  color: white;

}

.card {

  margin: 0 16px 14px;

  padding: 17px;

  background: #151d26;

  border: 1px solid #26313d;

  border-radius: 16px;

}

.price {

  font-size: 27px;

  font-weight: 800;

  margin: 6px 0 15px;

}

.actions {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

}

button {

  border: 0;

  border-radius: 11px;

  padding: 14px;

  font-size: 15px;

  font-weight: 800;

}

.buy {

  background: #35c982;

  color: #07150e;

}

.sell {

  background: #e96b6b;

  color: #1b0707;

}

.bot {

  display: flex;

  align-items: center;

  justify-content: space-between;

}

.toggle {

  width: 54px;

  height: 30px;

  border-radius: 20px;

  background: #394653;

  padding: 3px;

}

.toggle span {

  display: block;

  width: 24px;

  height: 24px;

  border-radius: 50%;

  background: white;

  transition: .2s;

}

.toggle.on {

  background: #35c982;

}

.toggle.on span {

  transform: translateX(24px);

}

.position {

  display: flex;

  justify-content: space-between;

  padding: 11px 0;

  border-bottom: 1px solid #26313d;

}

.position:last-child {

  border-bottom: 0;

}

.muted {

  color: #8997a5;

}

.footer {

  text-align: center;

  color: #667481;

  font-size: 11px;

  padding: 12px;

}

</style>

</head>

<body>

<div class="app">

  <div class="header">

    <div class="logo">TradePilot</div>

    <div class="demo">PAPER TRADING</div>

  </div>

  <div class="balance">

    <div class="label">Paper account balance</div>

    <div class="big" id="balance">$1,000.00</div>

    <div class="stats">

      <div class="stat">

        <div class="label">Today's P/L</div>

        <div class="value" id="profit">$0.00</div>

      </div>

      <div class="stat">

        <div class="label">Open positions</div>

        <div class="value" id="positionCount">0</div>

      </div>

    </div>

  </div>

  <div class="tabs">

    <button class="tab active" onclick="selectAsset('BTC')">BTC</button>

    <button class="tab" onclick="selectAsset('ETH')">ETH</button>

  </div>

  <div class="card">

    <div class="label" id="assetName">Bitcoin</div>

    <div class="price" id="price">$100,000.00</div>

    <div class="actions">

      <button class="buy" onclick="trade('BUY')">BUY</button>

      <button class="sell" onclick="trade('SELL')">SELL</button>

    </div>

  </div>

  <div class="card">

    <div class="bot">

      <div>

        <strong>Trading Bot</strong>

        <div class="label" id="botStatus">Stopped</div>

      </div>

      <button class="toggle" id="toggle" onclick="toggleBot()">

        <span></span>

      </button>

    </div>

  </div>

  <div class="card">

    <strong>Open Positions</strong>

    <div id="positions" class="muted" style="padding-top:12px;">

      No open positions

    </div>

  </div>

  <div class="card">

    <strong>Trading History</strong>

    <div id="history" class="muted" style="padding-top:12px;">

      No trades yet

    </div>

  </div>

  <div class="footer">

    TradePilot • Demo mode only

  </div>

</div>

<script>

let balance = 1000;

let profit = 0;

let selectedAsset = "BTC";

let botRunning = false;

let positions = [];

let history = [];

const prices = {

  BTC: 100000,

  ETH: 3500

};

function money(value) {

  return "$" + value.toLocaleString("en-AU", {

    minimumFractionDigits: 2,

    maximumFractionDigits: 2

  });

}

function selectAsset(asset) {

  selectedAsset = asset;

  document.getElementById("assetName").textContent =

    asset === "BTC" ? "Bitcoin" : "Ethereum";

  document.getElementById("price").textContent =

    money(prices[asset]);

  document.querySelectorAll(".tab").forEach((button, index) => {

    button.classList.toggle(

      "active",

      (asset === "BTC" && index === 0) ||

      (asset === "ETH" && index === 1)

    );

  });

}

function trade(type) {

  const price = prices[selectedAsset];

  if (type === "BUY") {

    const amount = 100;

    if (balance < amount) {

      alert("Not enough paper balance.");

      return;

    }

    balance -= amount;

    positions.push({

      asset: selectedAsset,

      type: "BUY",

      amount: amount,

      price: price

    });

  } else {

    const index = positions.findIndex(

      p => p.asset === selectedAsset

    );

    if (index === -1) {

      alert("No open paper position for " + selectedAsset);

      return;

    }

    const position = positions[index];

    balance += position.amount;

    positions.splice(index, 1);

  }

  history.unshift({

    asset: selectedAsset,

    type: type,

    price: price,

    time: new Date().toLocaleTimeString()

  });

  render();

}

function toggleBot() {

  botRunning = !botRunning;

  document.getElementById("toggle")

    .classList.toggle("on", botRunning);

  document.getElementById("botStatus").textContent =

    botRunning ? "Running in paper mode" : "Stopped";

}

function render() {

  document.getElementById("balance").textContent =

    money(balance);

  document.getElementById("profit").textContent =

    money(profit);

  document.getElementById("positionCount").textContent =

    positions.length;

  const positionsBox = document.getElementById("positions");

  if (!positions.length) {

    positionsBox.innerHTML =

      "No open positions";

  } else {

    positionsBox.innerHTML = positions.map(p => `

      <div class="position">

        <span>

          <strong>${p.asset}</strong>

          <div class="muted">${p.type}</div>

        </span>

        <span>${money(p.amount)}</span>

      </div>

    `).join("");

  }

  const historyBox = document.getElementById("history");

  if (!history.length) {

    historyBox.innerHTML = "No trades yet";

  } else {

    historyBox.innerHTML = history.slice(0, 8).map(h => `

      <div class="position">

        <span>

          <strong>${h.type} ${h.asset}</strong>

          <div class="muted">${h.time}</div>

        </span>

        <span>${money(h.price)}</span>

      </div>

    `).join("");

  }

}

render();

</script>

</body>

</html>
